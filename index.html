<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science-Innovation-Management</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --border: #dfe6f1;
        --text: #1f2a37;
        --muted: #5b6472;
        --primary: #2457c5;
        --primary-soft: #edf3ff;
        --accent: #e7f3f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }

      .container {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px 60px;
      }

      .header {
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        color: white;
        border-radius: 18px;
        padding: 30px 32px;
        margin-bottom: 24px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .header p {
        margin: 8px 0 0;
        opacity: 0.9;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .tree h2,
      .content h2 {
        margin-top: 0;
        font-size: 1.25rem;
      }

      .file-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .file-list a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text);
        background: #f8fafc;
        border: 1px solid transparent;
        transition: 0.2s ease;
      }

      .file-list a:hover {
        background: var(--primary-soft);
        border-color: #cfe0ff;
      }

      .badge {
        display: inline-block;
        min-width: 36px;
        text-align: center;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--accent);
        color: #0f766e;
      }

      .badge.pdf { background: #fff1f2; color: #be123c; }
      .badge.image { background: #fff7ed; color: #c2410c; }
      .badge.folder { background: #eef2ff; color: #3730a3; }
      .badge.readme { background: #ecfdf5; color: #047857; }

      .content {
        min-width: 0;
      }

      #readme-container {
        font-size: 1rem;
      }

      #readme-container h1,
      #readme-container h2,
      #readme-container h3 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #111827;
      }

      #readme-container h1 { font-size: 2rem; }
      #readme-container h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
      #readme-container h3 { font-size: 1.2rem; }

      #readme-container p,
      #readme-container li {
        color: var(--text);
      }

      #readme-container ul,
      #readme-container ol {
        padding-left: 1.5rem;
      }

      #readme-container strong {
        color: #0f172a;
      }

      #readme-container a {
        color: var(--primary);
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Science-Innovation-Management</h1>
        <p>課程主頁｜檔案索引與 README 摘要</p>
      </header>

      <main class="grid">
        <aside class="panel tree">
          <h2>目錄檔案</h2>
          <ul class="file-list" id="file-list"></ul>
        </aside>

        <section class="panel content">
          <h2>README.md</h2>
          <div id="readme-container"></div>
        </section>
      </main>
    </div>

    <script>
      const files = [
        { name: 'README.md', href: 'README.md', type: 'readme' },
        { name: '2026 EMBA TIM Syllabus.pdf', href: '2026 EMBA TIM Syllabus.pdf', type: 'pdf' },
        { name: 'Images/', href: 'Images/', type: 'folder' },
        { name: '第一堂_學期規則說明_20260907_01.png', href: 'Images/第一堂_學期規則說明_20260907_01.png', type: 'image' }
      ];

      const fileList = document.getElementById('file-list');
      files.forEach((file) => {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = file.href;
        link.target = '_blank';

        const badge = document.createElement('span');
        badge.className = `badge ${file.type}`;
        badge.textContent = file.type === 'readme' ? 'MD' : file.type === 'pdf' ? 'PDF' : file.type === 'image' ? 'IMG' : 'DIR';

        const name = document.createElement('span');
        name.textContent = file.name;

        link.appendChild(badge);
        link.appendChild(name);
        li.appendChild(link);
        fileList.appendChild(li);
      });

      const readmeText = `# 1151科技與創新管理 Science-Innovation-Management 陳正綱 老師 

# 學期待辦事項及注意事項

## 學期待辦事項（課程任務與成績評量）

*   **隨堂各組口頭報告（佔 50%）**：
    *   不需自行尋找組員，待加退選結束後，老師會親自分組，且同組通常會混合兩個系所以上的學生。
    *   隨著課程進展，課堂上會指派議題，小組需在課堂上討論，並製作約 3 頁的 PPT 上台報告分享看法與作法。
*   **期末個人書面報告（佔 40%）**：
    *   每個人都必須繳交一份個人報告，無嚴格的字數、行距或字體規定，一切依個人良心撰寫。
    *   報告內容可二選一：
        1.  去閱讀一本一直想讀但沒時間讀的書（如經典書籍），並撰寫讀書心得與啟發。
        2.  分享自身工作領域中（例如資安等）與科技管理相關且值得與大家分享的知識或經驗，需寫得讓大家都能看懂。
*   **課堂參與與作業（佔 10% 另加平時加分）**：
    *   助教會在旁記錄學生的課堂表現（包含發言情況、是否睡覺或私下看電腦等），積極參與發言與互動者會有額外加分。

## 學期注意事項

*   **上課時間調整**：
    *   雖然表定時間為 18:25，但考量大家下班通勤與用餐辛苦，老師通常會在 18:50 到 19:00 之間才開始上課。
    *   下課時間通常會落在 21:20 到 21:30 之間。
*   **出缺席與請假原則**：
    *   出席是基本要求，課堂上會進行點名。
    *   一學期的缺席（包含病假、公假、事假、出差等）最好不要超過 5 次。若有特殊健康狀況需治療，可私下告知老師個別處理。
*   **課堂紀律與用餐**：
    *   鼓勵大家吃飽再來上課，但不要吃太飽以免想睡。
    *   如果因工作太累而在課堂上睡著是可以被體諒的，但基本要求是「絕對不能吵到別人」。
*   **使用 AI 輔助的提醒**：
    *   在思考課堂議題或寫報告時，若使用 AI（如 ChatGPT）輔助，務必要融入自己對該產業的認識與見解，不能盲目依賴，這樣產出的內容才會具備獨特價值。
*   **針對博士班學生的特別提醒**：
    *   老師明確表示，這門課對博士班學生的論文撰寫及畢業資格沒有直接幫助，提醒博班生需事先了解以避免期望落差。
*   **聯絡老師的方式**：
    *   建議透過 LINE 社群群組找到老師，標記（Tag）他並加好友，有事透過 LINE 聯絡較為即時。
    *   Email 大約兩三天到一個禮拜才會查看一次。
*   **未來課程行程異動預告**：
    *   老師預計在 10 月 12 日當週帶團前往德國，隨後可能於 10 月 19 日前往立陶宛交流。
    *   老師出國期間，可能會安排業師（東捷資訊董事長或其指派之副總級高管）來進行協同教學分享。`;

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderMarkdown(md) {
        const lines = md.split(/\r?\n/);
        let html = '';
        let listType = null;
        let listBuffer = [];

        const flushList = () => {
          if (listBuffer.length > 0) {
            const tag = listType === 'ol' ? 'ol' : 'ul';
            html += `<${tag}>\n${listBuffer.join('\n')}\n</${tag}>\n`;
            listBuffer = [];
            listType = null;
          }
        };

        const renderListItem = (raw) => {
          const content = raw.replace(/^\s*[-*+]\s*/, '').trim();
          return `<li>${content}</li>`;
        };

        const renderOrderedItem = (raw) => {
          const content = raw.replace(/^\s*\d+\.\s*/, '').trim();
          return `<li>${content}</li>`;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (!trimmed) {
            flushList();
            continue;
          }

          if (/^#{1,3}\s+/.test(trimmed)) {
            flushList();
            const match = trimmed.match(/^(#+)\s+(.*)$/);
            const level = match[1].length;
            const text = match[2].trim();
            html += `<h${level}>${escapeHtml(text)}</h${level}>\n`;
            continue;
          }

          if (/^\s*[-*+]\s+/.test(line)) {
            if (listType !== 'ul') {
              flushList();
              listType = 'ul';
            }
            listBuffer.push(renderListItem(line));
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            if (listType !== 'ol') {
              flushList();
              listType = 'ol';
            }
            listBuffer.push(renderOrderedItem(line));
            continue;
          }

          flushList();
          html += `<p>${escapeHtml(trimmed)}</p>\n`;
        }

        flushList();
        return html;
      }

      document.getElementById('readme-container').innerHTML = renderMarkdown(readmeText);
    </script>
  </body>
</html>
