<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science-Innovation-Management</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --border: #dfe6f1;
        --text: #1f2a37;
        --muted: #5b6472;
        --primary: #2457c5;
        --primary-soft: #edf3ff;
        --accent: #e7f3f0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }

      .container {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px 60px;
      }

      .header {
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        color: white;
        border-radius: 18px;
        padding: 30px 32px;
        margin-bottom: 24px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .header p {
        margin: 8px 0 0;
        opacity: 0.9;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .tree h2,
      .content h2 {
        margin-top: 0;
        font-size: 1.25rem;
      }

      .file-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .file-list a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text);
        background: #f8fafc;
        border: 1px solid transparent;
        transition: 0.2s ease;
      }

      .file-list a:hover {
        background: var(--primary-soft);
        border-color: #cfe0ff;
      }

      .badge {
        display: inline-block;
        min-width: 36px;
        text-align: center;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--accent);
        color: #0f766e;
      }

      .badge.pdf { background: #fff1f2; color: #be123c; }
      .badge.image { background: #fff7ed; color: #c2410c; }
      .badge.folder { background: #eef2ff; color: #3730a3; }
      .badge.readme { background: #ecfdf5; color: #047857; }

      .content {
        min-width: 0;
      }

      #readme-container {
        font-size: 1rem;
      }

      #readme-container h1,
      #readme-container h2,
      #readme-container h3 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #111827;
      }

      #readme-container h1 { font-size: 2rem; }
      #readme-container h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
      #readme-container h3 { font-size: 1.2rem; }

      #readme-container p,
      #readme-container li {
        color: var(--text);
      }

      #readme-container ul,
      #readme-container ol {
        padding-left: 1.5rem;
      }

      #readme-container strong {
        color: #0f172a;
      }

      #readme-container a {
        color: var(--primary);
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Science-Innovation-Management</h1>
        <p>課程主頁｜檔案索引與 README 摘要</p>
      </header>

      <main class="grid">
        <aside class="panel tree">
          <h2>目錄檔案</h2>
          <ul class="file-list" id="file-list"></ul>
        </aside>

        <section class="panel content">
          <h2>README.md</h2>
          <div id="readme-container"></div>
        </section>
      </main>
    </div>

    <script>
      const owner = 'cjs930';
      const repo = 'Science-Innovation-Management';
      const branch = 'main';
      const pagesBase = `https://${owner}.github.io/${repo}/`;

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderMarkdown(md) {
        const lines = md.split(/\r?\n/);
        let html = '';
        let listType = null;
        let listBuffer = [];

        const flushList = () => {
          if (listBuffer.length > 0) {
            const tag = listType === 'ol' ? 'ol' : 'ul';
            html += `<${tag}>\n${listBuffer.join('\n')}\n</${tag}>\n`;
            listBuffer = [];
            listType = null;
          }
        };

        const renderListItem = (raw) => {
          const content = raw.replace(/^\s*[-*+]\s*/, '').trim();
          return `<li>${escapeHtml(content)}</li>`;
        };

        const renderOrderedItem = (raw) => {
          const content = raw.replace(/^\s*\d+\.\s*/, '').trim();
          return `<li>${escapeHtml(content)}</li>`;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (!trimmed) {
            flushList();
            continue;
          }

          if (/^#{1,3}\s+/.test(trimmed)) {
            flushList();
            const match = trimmed.match(/^(#+)\s+(.*)$/);
            const level = match[1].length;
            const text = match[2].trim();
            html += `<h${level}>${escapeHtml(text)}</h${level}>\n`;
            continue;
          }

          if (/^\s*[-*+]\s+/.test(line)) {
            if (listType !== 'ul') {
              flushList();
              listType = 'ul';
            }
            listBuffer.push(renderListItem(line));
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            if (listType !== 'ol') {
              flushList();
              listType = 'ol';
            }
            listBuffer.push(renderOrderedItem(line));
            continue;
          }

          flushList();
          html += `<p>${escapeHtml(trimmed)}</p>\n`;
        }

        flushList();
        return html;
      }

      function makeFileUrl(path) {
        return pagesBase + path.split('/').map(encodeURIComponent).join('/');
      }

      async function loadRepoContents(path = '') {
        const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        try {
          const res = await fetch(api);
          if (!res.ok) throw new Error('GitHub API 回應 ' + res.status);
          const data = await res.json();
          data.sort((a, b) => {
            if (a.type === b.type) return a.name.localeCompare(b.name, 'zh-TW');
            return a.type === 'dir' ? -1 : 1;
          });

          const fileList = document.getElementById('file-list');
          fileList.innerHTML = '';
          data.forEach((item) => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            const isDir = item.type === 'dir';
            link.href = isDir ? makeFileUrl(item.path) + '/' : makeFileUrl(item.path);
            link.target = '_blank';

            const badge = document.createElement('span');
            let tclass = 'file';
            if (isDir) {
              badge.textContent = 'DIR';
              tclass = 'folder';
            } else if (/\.(pdf)$/i.test(item.name)) {
              badge.textContent = 'PDF';
              tclass = 'pdf';
            } else if (/\.(png|jpe?g|gif|svg)$/i.test(item.name)) {
              badge.textContent = 'IMG';
              tclass = 'image';
            } else if (/readme\.md$/i.test(item.name)) {
              badge.textContent = 'MD';
              tclass = 'readme';
            } else {
              badge.textContent = 'FILE';
            }
            badge.className = 'badge ' + tclass;

            const name = document.createElement('span');
            name.textContent = item.name;

            link.appendChild(badge);
            link.appendChild(name);
            li.appendChild(link);
            fileList.appendChild(li);
          });
        } catch (err) {
          document.getElementById('file-list').innerHTML = `<li><em>無法取得檔案清單 — ${escapeHtml(String(err))}</em></li>`;
        }
      }

      async function loadReadme() {
        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/README.md`;
        try {
          const res = await fetch(rawUrl);
          if (!res.ok) throw new Error('無法取得 README.md');
          const md = await res.text();
          document.getElementById('readme-container').innerHTML = renderMarkdown(md);
        } catch (err) {
          document.getElementById('readme-container').innerHTML = `<p>無法載入 README.md，請至 <a href="https://github.com/${owner}/${repo}" target="_blank">GitHub 倉庫</a> 查看。</p>`;
        }
      }

      // 初始化
      loadRepoContents();
      loadReadme();
    </script>
  </body>
</html>
